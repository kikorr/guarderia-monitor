services:
  guarderia-monitor:
    build: .
    # Alternativa sin compilar (imagen ya construida por CI):
    # image: ghcr.io/kikorr/guarderia-monitor:latest
    container_name: guarderia-monitor
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data          # estado + caché de medios (no se comparte con nadie)
    # Para probar la cadena completa sin entrar en el bucle:
    #   SELF_TEST=1 docker compose run --rm guarderia-monitor
